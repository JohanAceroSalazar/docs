openapi: 3.1.0
info:
  title: Reference Data Service API — Horarios SENA
  version: 1.0.0
  description: >-
    Jerarquía institucional (macrorregión → microrregión → departamento → municipio →
    centro de formación → unidad institucional), catálogos parametrizables
    (`catalog`/`catalog_detail`) y parámetros del sistema (EAV). Fuente de verdad del
    contrato. Alineado con el modelo de datos de reference-data-service y con
    07-api/guidelines.md. La extensión `x-required-feature` declara el feature RBAC
    que exige cada operación (ver rbac-design.md, módulo `MOD_REFERENCE`).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: institutional-hierarchy
    description: Jerarquía geográfica e institucional (macrorregión…unidad institucional).
  - name: catalogs
    description: Catálogos parametrizables y sus valores.
  - name: parameters
    description: Parámetros del sistema (patrón EAV).
  - name: reports
    description: Reportes propios del dominio de datos de referencia.

paths:
  # ---------------------------------------------------------------- macroregions
  /macroregions:
    get:
      operationId: listMacroregions
      tags: [institutional-hierarchy]
      summary: Lista paginada de macrorregiones.
      x-required-feature: REF_HIERARCHY_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: code
          in: query
          required: false
          description: Filtra por código SENA exacto.
          schema: { type: string, maxLength: 10 }
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Página de macrorregiones.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Macroregion' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createMacroregion
      tags: [institutional-hierarchy]
      summary: Crea una macrorregión.
      x-required-feature: REF_HIERARCHY_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MacroregionCreate' }
      responses:
        '201':
          description: Macrorregión creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Macroregion' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /macroregions/{id}:
    parameters:
      - $ref: '#/components/parameters/MacroregionId'
    get:
      operationId: getMacroregion
      tags: [institutional-hierarchy]
      summary: Detalle de una macrorregión.
      x-required-feature: REF_HIERARCHY_VIEW
      responses:
        '200':
          description: Macrorregión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Macroregion' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateMacroregion
      tags: [institutional-hierarchy]
      summary: Actualiza una macrorregión.
      x-required-feature: REF_HIERARCHY_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MacroregionUpdate' }
      responses:
        '200':
          description: Macrorregión actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Macroregion' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteMacroregion
      tags: [institutional-hierarchy]
      summary: Desactiva una macrorregión (soft delete vía is_active).
      x-required-feature: REF_HIERARCHY_MANAGE
      responses:
        '204':
          description: Macrorregión desactivada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }

