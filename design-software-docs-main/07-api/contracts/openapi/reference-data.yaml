            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Alguna dependencia no está lista.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  parameters:
    MacroregionId:
      name: id
      in: path
      required: true
      description: UUID de la macrorregión.
      schema: { type: string, format: uuid }
    MicroregionId:
      name: id
      in: path
      required: true
      description: UUID de la microrregión.
      schema: { type: string, format: uuid }
    DepartmentId:
      name: id
      in: path
      required: true
      description: UUID del departamento.
      schema: { type: string, format: uuid }
    MunicipalityId:
      name: id
      in: path
      required: true
      description: UUID del municipio.
      schema: { type: string, format: uuid }
    TrainingCenterId:
      name: id
      in: path
      required: true
      description: UUID del centro de formación.
      schema: { type: string, format: uuid }
    InstitutionalUnitId:
      name: id
      in: path
      required: true
      description: UUID de la unidad institucional.
      schema: { type: string, format: uuid }
    CatalogId:
      name: id
      in: path
      required: true
      description: UUID del catálogo.
      schema: { type: string, format: uuid }
    ParameterId:
      name: id
      in: path
      required: true
      description: UUID del parámetro.
      schema: { type: string, format: uuid }

  schemas:
    # ---------------------------------------------------- jerarquía institucional
    Macroregion:
      type: object
      required: [id, name, code, is_active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10, description: UNIQUE; código SENA. }
        is_active: { type: boolean }

    MacroregionCreate:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10 }
        is_active: { type: boolean, default: true }

    MacroregionUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10 }
        is_active: { type: boolean }

    Microregion:
      type: object
      required: [id, macroregion_id, name, code, is_active]
      properties:
        id: { type: string, format: uuid }
        macroregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10, description: UNIQUE dentro de la macrorregión padre. }
        is_active: { type: boolean }

    MicroregionCreate:
      type: object
      required: [macroregion_id, name, code]
      properties:
        macroregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10 }
        is_active: { type: boolean, default: true }

    MicroregionUpdate:
      type: object
      properties:
        macroregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 10 }
        is_active: { type: boolean }

    Department:
      type: object
      required: [id, microregion_id, name, dane_code, is_active]
      properties:
        id: { type: string, format: uuid }
        microregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        dane_code: { type: string, maxLength: 5, description: UNIQUE nacional; código DANE del departamento. }
        is_active: { type: boolean }

    DepartmentCreate:
      type: object
      required: [microregion_id, name, dane_code]
      properties:
        microregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        dane_code: { type: string, maxLength: 5 }
        is_active: { type: boolean, default: true }

    DepartmentUpdate:
      type: object
      properties:
        microregion_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        dane_code: { type: string, maxLength: 5 }
        is_active: { type: boolean }

    Municipality:
      type: object
      required: [id, department_id, name, dane_code, is_active]
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        dane_code: { type: string, maxLength: 8, description: UNIQUE nacional; código DANE del municipio. }
        is_active: { type: boolean }

    MunicipalityCreate:
      type: object
      required: [department_id, name, dane_code]
      properties:
        department_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        dane_code: { type: string, maxLength: 8 }
        is_active: { type: boolean, default: true }

    MunicipalityUpdate:
      type: object
      properties:
        department_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        dane_code: { type: string, maxLength: 8 }
        is_active: { type: boolean }

    TrainingCenter:
      type: object
      required: [id, municipality_id, center_code, name, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        municipality_id: { type: string, format: uuid }
        center_code: { type: string, maxLength: 10, description: UNIQUE; código SENA del centro; referenciado desde otros servicios. }
        name: { type: string, maxLength: 200 }
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          maxLength: 20
          description: PII.
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TrainingCenterCreate:
      type: object
      required: [municipality_id, center_code, name]
      properties:
        municipality_id: { type: string, format: uuid }
        center_code: { type: string, maxLength: 10 }
        name: { type: string, maxLength: 200 }
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
