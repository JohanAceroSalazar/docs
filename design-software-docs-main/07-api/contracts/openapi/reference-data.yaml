      responses:
        '200':
          description: Servicio vivo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      summary: Readiness probe con verificación de dependencias.
