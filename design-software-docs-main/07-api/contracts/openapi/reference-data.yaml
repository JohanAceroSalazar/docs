  # ---------------------------------------------------------------- reports (own domain)
  /reports/active-catalog:
    get:
      operationId: reportActiveCatalog
      tags: [reports]
      summary: Inventario de catálogos activos con sus valores activos.
      description: >-
        Reporte propio del dominio de datos de referencia sobre `catalog` +
        `catalog_detail` (solo filas con `is_active = true`). Permite precargar de una
        sola llamada todos los selects/dropdowns parametrizados en vez de resolver
        `catalog_detail` por catálogo (N+1). Solo lectura.
        Inventario — Consumidores: frontend (selects), academic-management-service,
        training-environment-service, actors-service; Frecuencia: al iniciar sesión /
        cacheado con TTL en el consumidor; Formato: JSON; Fuente: `catalog` +
        `catalog_detail`.
      x-required-feature: REF_CATALOG_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - name: catalog_code
          in: query
          required: false
