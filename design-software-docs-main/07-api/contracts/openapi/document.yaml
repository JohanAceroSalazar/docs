openapi: 3.1.0
info:
  title: Document Service API — Horarios SENA
  version: 1.0.0
  description: >-
    Ciclo de vida de documentos generados/almacenados por la plataforma (agregados
    `document` + `document_version`). Generación asíncrona a partir de plantillas,
    registro manual de documentos ya subidos a object storage, carga de nuevas
    versiones vía `multipart/form-data` y descarga por URL firmada (el binario
    nunca se sirve ni se persiste en este servicio; ver ADR-003). Alineado con el
    modelo de datos de document-service y con 07-api/guidelines.md. La extensión
    `x-required-feature` declara el feature RBAC que exige cada operación.
    El acceso a los documentos se resuelve por el scope del token de iam-service
    (`GLOBAL` ve todos los documentos; `TRAINING_CENTER` solo los de su centro de
    formación). Un documento fuera del scope del usuario responde `404`, igual que
    uno inexistente; un feature o scope que no concede acceso a documentos responde `403`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: documents
    description: Documentos generados o registrados en la plataforma.
  - name: versions
    description: Historial de versiones de un documento.
  - name: reports
    description: Reportes propios del dominio document-service.

paths:
  # ---------------------------------------------------------------- documents
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: Lista paginada de documentos.
      description: >-
        Solo retorna los documentos dentro del scope del usuario. `sort` usa el formato
        `<campo>:<asc|desc>`; campos permitidos: `created_at`, `updated_at`, `title`,
        `status`, `domain` y `owner_service` (por defecto `created_at:desc`); otro valor
        responde `400` con code `INVALID_SORT`.
      x-required-feature: DOC_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: domain
          in: query
          required: false
          description: Filtra por dominio/tipo de documento.
          schema: { $ref: '#/components/schemas/DocumentDomain' }
        - name: status
          in: query
          required: false
          description: Filtra por estado del documento.
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: owner_service
          in: query
          required: false
          description: Filtra por servicio propietario que originó el documento.
          schema: { type: string, maxLength: 100 }
        - name: owner_entity_id
          in: query
          required: false
          description: Filtra por el UUID de la entidad de negocio propietaria (en el servicio `owner_service`).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de documentos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createDocument
      tags: [documents]
      summary: Registra un documento cuyo binario ya fue subido al object storage.
      description: >-
        Uso típico: integración servicio-a-servicio que ya escribió el archivo en
        MinIO/S3 (p. ej. mediante una URL de subida firmada emitida fuera de esta
        API) y solo necesita registrar los metadatos. `storage_key` es de solo
        escritura: nunca se retorna en las respuestas (ver `GET /documents/{id}/download-url`).
      x-required-feature: DOC_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreate' }
      responses:
        '201':
          description: Documento registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /documents/generate:
    post:
      operationId: generateDocument
      tags: [documents]
      summary: Solicita la generación asíncrona de un documento a partir de una plantilla.
      description: >-
        Crea el registro `document` en `status = GENERATING`, encola la solicitud
        en `document-generation-queue` para el pdf-renderer-worker y retorna de
        inmediato. El cliente debe sondear `GET /documents/{id}` hasta observar
        `status = AVAILABLE` o `GENERATION_FAILED` (decisión 02 de decisions.md).
        La generación es siempre asíncrona; no existe variante síncrona. Valida que exista
        una plantilla **activa** para `template_code` (si no, `404` con code
        `TEMPLATE_NOT_FOUND` y no se encola nada). El `correlation_id` (header
        `X-Correlation-Id`, generado si no llega) se propaga al mensaje de la cola. Si el
        broker no acepta el mensaje responde `503` con code `GENERATION_QUEUE_UNAVAILABLE`
        y el documento queda en `GENERATION_FAILED`.
      x-required-feature: DOC_CREATE
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateDocumentRequest' }
      responses:
        '202':
          description: Solicitud aceptada; el documento queda en GENERATING.
          headers:
            X-Correlation-Id:
              description: Identificador de correlación propagado al mensaje de la cola.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDocumentResponse' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404':
          description: No existe una plantilla activa para `template_code` (code `TEMPLATE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Detalle de un documento.
      description: >-
        Un documento fuera del scope del usuario responde `404`, igual que uno inexistente.
        Mientras el documento está en `GENERATING` no se expone ninguna URL de descarga y
        `mime_type` es `null`.
      x-required-feature: DOC_VIEW
      responses:
        '200':
          description: Documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Actualiza metadatos del documento (título, dominio).
      description: >-
        Actualización parcial. `row_version` es obligatorio para bloqueo optimista;
        si no coincide con el valor actual del recurso, responde `409 Conflict`.
      x-required-feature: DOC_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200':
          description: Documento actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: archiveDocument
      tags: [documents]
      summary: Archiva el documento (soft delete; status = ARCHIVED).
      x-required-feature: DOC_ARCHIVE
      responses:
        '204':
          description: Documento archivado.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /documents/{id}/download-url:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocumentDownloadUrl
      tags: [documents]
      summary: Genera una URL firmada de descarga de la versión vigente.
      description: >-
        La URL firmada se emite solo tras validar el scope del usuario sobre la
        entidad propietaria; TTL por defecto 300 s (ADR-003). El binario nunca se
        proxya a través de esta API y `storage_key` nunca se expone al cliente;
        el consumidor descarga directamente desde el object storage con la URL
        devuelta. Requiere `status = AVAILABLE`: en cualquier otro estado responde `409` con
        code `DOCUMENT_NOT_AVAILABLE`. Un documento fuera del scope del usuario responde `404`.
      x-required-feature: DOC_DOWNLOAD
      responses:
        '200':
          description: URL firmada de descarga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrlResponse' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: El documento no está AVAILABLE (code `DOCUMENT_NOT_AVAILABLE`).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '503':
          description: El object storage no permite firmar la URL (code `STORAGE_UNAVAILABLE`).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  # ---------------------------------------------------------------- versions
  /documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listDocumentVersions
      tags: [versions]
      summary: Historial de versiones del documento.
      x-required-feature: DOC_VIEW
      responses:
        '200':
          description: Lista de versiones, orden descendente por `version_number`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: uploadDocumentVersion
      tags: [versions]
      summary: Sube el binario de una nueva versión del documento.
      description: >-
        Carga directa vía `multipart/form-data` (guidelines §1): el binario viaja
        en la parte `file`. El servicio lo escribe en object storage, crea el
        `document_version` con `version_number` autoincremental y actualiza
        `document.storage_key`/`status = AVAILABLE` para apuntar a esta versión
        (desnormalización intencional, ver data-model.md).
      x-required-feature: DOC_CREATE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentVersionUpload' }
            encoding:
              file:
                contentType: application/octet-stream, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: Versión creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /documents/{id}/versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getDocumentVersion
      tags: [versions]
      summary: Detalle de una versión específica del documento.
      x-required-feature: DOC_VIEW
      responses:
        '200':
          description: Versión del documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- reports (own domain)
  /reports/document-status:
    get:
      operationId: reportDocumentStatus
      tags: [reports]
      summary: Inventario de documentos por entidad propietaria, dominio y estado.
      description: >-
        Reporte propio del dominio document-service sobre `document`. Solo lectura;
        no muta estado. Paginación por offset (guidelines §6) por tratarse de un
        inventario acotado, no de un log continuo. Inventario — Usuarios: servicios
        propietarios (SCHEDULE, FICHA, CERTIFICATE, ACTOR, REPORT) y coordinadores/
        administradores; Frecuencia: on-demand; Formato: JSON; Fuente: `document`.
      x-required-feature: DOC_REPORT_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - name: domain
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DocumentDomain' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: owner_service
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: owner_entity_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Inicio del rango de `created_at` (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Fin del rango de `created_at` (exclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página del inventario de documentos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentStatusEntry' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }

  /health:
    get:
      operationId: health
      tags: [health]
      summary: Liveness probe del servicio.
      security: []
      responses:
        '200':
          description: Servicio vivo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      description: UUID del documento.
      schema: { type: string, format: uuid }
    VersionId:
      name: version_id
      in: path
      required: true
      description: UUID de la versión del documento.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación; si no se envía, el servicio genera uno.
      schema: { type: string }

  responses:
    ServiceUnavailable:
      description: Dependencia no disponible (p. ej. broker de mensajería; code `GENERATION_QUEUE_UNAVAILABLE`).
      content:
        application/json:
          schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  schemas:
    DocumentDomain:
      type: string
      description: Contexto de negocio que originó el documento.
      enum: [SCHEDULE, FICHA, CERTIFICATE, ACTOR, REPORT]

    DocumentStatus:
      type: string
      enum: [GENERATING, AVAILABLE, ARCHIVED, EXPIRED, GENERATION_FAILED]

    Document:
      type: object
      required:
        - id
        - title
        - domain
        - owner_service
        - owner_entity_id
        - mime_type
        - status
        - row_version
        - created_by
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        template_id:
          type: [string, 'null']
          format: uuid
          description: FK a `document_template`; null si es un documento libre (no generado desde plantilla).
        title: { type: string, maxLength: 300 }
        domain: { $ref: '#/components/schemas/DocumentDomain' }
        owner_service:
          type: string
          maxLength: 100
          description: Servicio que solicitó/originó el documento.
        owner_entity_id:
          type: string
          format: uuid
          description: >-
            UUID de la entidad de negocio propietaria en `owner_service` (p. ej.
            un `schedule_id` en scheduling-service). Referencia lógica cross-service,
            sin FK física ni endpoint de join.
        mime_type:
          type: [string, 'null']
          maxLength: 100
          example: application/pdf
          description: Null mientras `status` sea `GENERATING` o `GENERATION_FAILED` (aún no hay archivo).
        size_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
        status: { $ref: '#/components/schemas/DocumentStatus' }
        row_version:
          type: integer
          readOnly: true
          description: Bloqueo optimista; requerido en `PATCH` para detectar escritura concurrente.
        created_by:
          type: string
          format: uuid
          description: ID de usuario (iam-service); referencia lógica sin FK física.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentCreate:
      type: object
      required: [title, domain, owner_service, owner_entity_id, storage_key, mime_type]
      properties:
        template_id:
          type: [string, 'null']
          format: uuid
        title: { type: string, maxLength: 300 }
        domain: { $ref: '#/components/schemas/DocumentDomain' }
        owner_service: { type: string, maxLength: 100 }
        owner_entity_id: { type: string, format: uuid }
        storage_key:
          type: string
          writeOnly: true
          description: >-
            Clave del objeto ya subido a object storage (fuera de esta API).
            Nunca se retorna en las respuestas; la descarga se resuelve vía
            `GET /documents/{id}/download-url`.
        mime_type: { type: string, maxLength: 100 }
        size_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0

    DocumentUpdate:
      type: object
      required: [row_version]
      properties:
        title: { type: string, maxLength: 300 }
        domain: { $ref: '#/components/schemas/DocumentDomain' }
        row_version:
          type: integer
          description: Valor de `row_version` leído por el cliente; debe coincidir con el actual o responde 409.

    GenerateDocumentRequest:
      type: object
      required: [template_code, domain, owner_service, owner_entity_id, title]
      properties:
        template_code:
          type: string
          maxLength: 50
          description: Referencia a `document_template.code`.
          example: SCHEDULE_CERTIFICATE
        domain: { $ref: '#/components/schemas/DocumentDomain' }
        owner_service: { type: string, maxLength: 100 }
        owner_entity_id: { type: string, format: uuid }
        title: { type: string, maxLength: 300 }
        data:
          type: object
          description: Contexto que el pdf-renderer-worker combina con la plantilla.
          additionalProperties: true

    GenerateDocumentResponse:
      type: object
      required: [document_id, status]
      properties:
        document_id: { type: string, format: uuid }
        status:
          type: string
          const: GENERATING

    DocumentVersion:
      type: object
      required: [id, document_id, version_number, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        version_number:
          type: integer
          minimum: 1
          description: Autoincremental por documento.
        created_by:
          type: string
          format: uuid
          description: ID de usuario (iam-service); referencia lógica sin FK física.
        created_at: { type: string, format: date-time }
        notes:
          type: [string, 'null']
          description: Observaciones sobre esta versión.

    DocumentVersionUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Binario de la nueva versión del documento.
        notes:
          type: string
          description: Observaciones sobre esta versión.

    DownloadUrlResponse:
      type: object
      required: [document_id, url, expires_in]
      properties:
        document_id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: URL firmada de un solo uso hacia el object storage.
        expires_in:
          type: integer
          description: Segundos de vigencia de la URL.
          example: 300

    DocumentStatusEntry:
      type: object
      required: [id, title, domain, owner_service, owner_entity_id, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 300 }
        domain: { $ref: '#/components/schemas/DocumentDomain' }
        owner_service: { type: string, maxLength: 100 }
        owner_entity_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        current_version_number:
          type: [integer, 'null']
          description: Número de la versión vigente (`document_version.version_number`); null si aún no tiene versiones.
        updated_at: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por iam-service; verificado localmente vía JWKS.



