  /reports/schedule-conflicts:
    get:
      operationId: reportScheduleConflicts
      tags: [reports]
      summary: Conflictos de horario detectados en toda la plataforma (paginación por cursor).
      description: >-
        Reporte propio del dominio scheduling sobre la tabla `scheduling_conflict`.
        Solo lectura. Usa paginación por cursor por ser una colección grande/continua
        (guidelines §6). Inventario — Usuarios: arquitectura y soporte de plataforma;
        Frecuencia: on-demand; Formato: JSON; Fuente: `scheduling_conflict`.
      x-required-feature: SCH_REPORT_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/cursor'
        - $ref: '_shared.yaml#/components/parameters/limit'
