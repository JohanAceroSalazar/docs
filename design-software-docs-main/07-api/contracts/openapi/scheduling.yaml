        - name: from
          in: query
          required: false
          description: Inicio del rango de `session_date` evaluado (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Fin del rango de `session_date` evaluado (exclusive).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página del reporte de ocupación por ambiente.
          content:
