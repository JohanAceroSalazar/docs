components:
  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      description: UUID del horario.
      schema: { type: string, format: uuid }
    SessionId:
      name: id
      in: path
      required: true
      description: UUID de la sesión de clase.
      schema: { type: string, format: uuid }
    TimeSlotId:
      name: id
      in: path
      required: true
      description: UUID de la franja horaria.
      schema: { type: string, format: uuid }
    ConflictId:
      name: id
      in: path
      required: true
      description: UUID del conflicto.
      schema: { type: string, format: uuid }

  schemas:
    Schedule:
      type: object
      required: [id, ficha_id, period, status, row_version, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        ficha_id:
          type: string
          format: uuid
          description: >-
            Referencia externa a `enrollment_ficha.id` en academic-management-service
            (sin FK física).
        period:
          type: string
          maxLength: 10
          description: 'Período académico, ej. `2026-1`.'
        name:
          type: [string, 'null']
          maxLength: 200
        status:
          type: string
          enum: [DRAFT, UNDER_REVIEW, PUBLISHED, ARCHIVED]
        published_at:
          type: [string, 'null']
          format: date-time
        published_by:
          type: [string, 'null']
          format: uuid
          description: UUID de usuario (iam-service) que publicó.
        row_version:
          type: integer
          description: Bloqueo optimista del agregado raíz.
        created_by:
          type: string
          format: uuid
          description: UUID de usuario (iam-service).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleCreate:
      type: object
      required: [ficha_id, period]
      properties:
        ficha_id: { type: string, format: uuid }
        period: { type: string, maxLength: 10 }
        name:
          type: [string, 'null']
          maxLength: 200

    ScheduleUpdate:
      type: object
      required: [row_version]
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
        row_version:
          type: integer
          description: '`row_version` vigente esperado; `409` si no coincide.'

    RowVersionRequest:
      type: object
      required: [row_version]
      properties:
        row_version:
          type: integer
          description: '`row_version` vigente esperado; `409` si no coincide.'

    Session:
      type: object
      required:
        - id
        - schedule_id
        - competency_id
        - environment_id
        - instructor_id
        - time_slot_id
        - session_date
        - day_of_week
        - start_time
        - end_time
        - status
        - updated_at
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        competency_id:
          type: string
          format: uuid
          description: >-
            Referencia externa a `competency.id` en academic-management-service (sin
            FK física).
        environment_id:
          type: string
          format: uuid
          description: >-
            Referencia externa a `environment.id` en training-environment-service (sin
            FK física).
        instructor_id:
          type: string
          format: uuid
          description: >-
            Referencia externa a `instructor.id` en actors-service (sin FK física).
        time_slot_id: { type: string, format: uuid }
        session_date: { type: string, format: date }
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: >-
            1=lunes … 7=domingo. Copia desnormalizada e inmutable de
            `time_slot.day_of_week`.
        start_time:
          type: string
          format: time
          description: Copia desnormalizada e inmutable de `time_slot.start_time`.
        end_time:
          type: string
          format: time
          description: Copia desnormalizada e inmutable de `time_slot.end_time`.
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
        notes:
          type: [string, 'null']
        updated_at: { type: string, format: date-time }

    SessionCreate:
      type: object
      required: [competency_id, environment_id, instructor_id, time_slot_id, session_date]
      properties:
        competency_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        time_slot_id: { type: string, format: uuid }
        session_date: { type: string, format: date }
        notes:
          type: [string, 'null']

    SessionUpdate:
      type: object
      properties:
        instructor_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        time_slot_id: { type: string, format: uuid }
        notes:
          type: [string, 'null']

    TimeSlot:
      type: object
      required: [id, name, day_of_week, start_time, end_time, shift]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: 1=lunes … 7=domingo.
        start_time: { type: string, format: time }
        end_time: { type: string, format: time }
        shift:
          type: string
          enum: [DAY, NIGHT, MIXED]

    TimeSlotCreate:
      type: object
      required: [name, day_of_week, start_time, end_time, shift]
      properties:
        name: { type: string, maxLength: 50 }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, format: time }
        end_time: { type: string, format: time }
        shift:
          type: string
          enum: [DAY, NIGHT, MIXED]

    TimeSlotUpdate:
      type: object
      required: [name, day_of_week, start_time, end_time, shift]
      properties:
        name: { type: string, maxLength: 50 }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, format: time }
        end_time: { type: string, format: time }
        shift:
          type: string
          enum: [DAY, NIGHT, MIXED]

    SchedulingConflict:
      type: object
      required: [id, schedule_id, session_a_id, conflict_type, description, is_resolved, detected_at]
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        session_a_id: { type: string, format: uuid }
        session_b_id:
          type: [string, 'null']
          format: uuid
          description: Null si el conflicto es simple (no involucra un segundo par).
        conflict_type:
          type: string
          enum: [INSTRUCTOR_DOUBLE_BOOKED, ENVIRONMENT_DOUBLE_BOOKED, SESSIONS_OVERLAP]
        description: { type: string }
        is_resolved: { type: boolean }
        detected_at: { type: string, format: date-time }

    ScheduleByInstructorEntry:
      type: object
      required: [instructor_id, schedule_count, session_count, total_hours]
      properties:
        instructor_id:
          type: string
          format: uuid
          description: Referencia externa a actors-service.
        schedule_count:
          type: integer
          description: Cantidad de horarios distintos en los que participa.
        session_count: { type: integer }
        total_hours:
          type: number
          description: Suma de horas de sesión en el rango filtrado.

    ScheduleByFichaEntry:
      type: object
      required: [ficha_id, schedule_id, period, status, session_count]
      properties:
        ficha_id:
          type: string
          format: uuid
          description: Referencia externa a academic-management-service.
        schedule_id: { type: string, format: uuid }
        period: { type: string, maxLength: 10 }
        status:
          type: string
          enum: [DRAFT, UNDER_REVIEW, PUBLISHED, ARCHIVED]
        session_count: { type: integer }
        instructor_count:
          type: integer
          description: Instructores distintos asignados en el horario.
        environment_count:
          type: integer
          description: Ambientes distintos usados en el horario.

    ScheduleByEnvironmentEntry:
      type: object
      required: [environment_id, session_count, total_hours, ficha_count]
      properties:
        environment_id:
          type: string
          format: uuid
          description: Referencia externa a training-environment-service.
        session_count: { type: integer }
        total_hours:
          type: number
          description: Suma de horas de sesión en el rango filtrado.
        ficha_count:
          type: integer
          description: Fichas distintas atendidas en el ambiente.

    EnvironmentOccupancyEntry:
      type: object
      required: [environment_id, period_from, period_to, occupied_slots, total_slots, occupancy_rate]
      properties:
        environment_id:
          type: string
          format: uuid
          description: Referencia externa a training-environment-service.
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        occupied_slots:
          type: integer
          description: Franjas ocupadas por sesiones `ACTIVE` en el rango.
        total_slots:
          type: integer
          description: Franjas disponibles del catálogo `time_slot` en el rango.
        occupancy_rate:
          type: number
          description: 'occupied_slots / total_slots, entre 0 y 1.'
          minimum: 0
          maximum: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por iam-service; verificado localmente vía JWKS.



