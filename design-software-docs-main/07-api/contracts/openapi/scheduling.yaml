openapi: 3.1.0
info:
  title: Scheduling Service API — Horarios SENA
  version: 1.0.0
  description: >-
    Construcción y publicación de horarios académicos: agregado `schedule` (borrador →
    revisión → publicado → archivado), sesiones de clase (`class_session`), franjas
    horarias reutilizables (`time_slot`) y detección/resolución de conflictos
    (`scheduling_conflict`). Fuente de verdad del contrato. Alineado con el modelo de
    datos de scheduling-service y con 07-api/guidelines.md. La extensión
    `x-required-feature` declara el feature RBAC (módulo `MOD_SCHEDULING`) que exige
    cada operación (o `x-required-feature-any: [A, B]` cuando la operación acepta
    cualquiera de varios features, p. ej. `SCH_VIEW_ALL` o `SCH_VIEW_OWN`); el `scope_type` asociado en el JWT (GLOBAL / TRAINING_CENTER /
    OWN_SCHEDULE / OWN_FICHA_AS_LEARNER) acota el filtro de datos aplicado por el
    servicio, sin exponer features adicionales por scope.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: schedules
    description: Agregado raíz `schedule` (borrador, revisión, publicación, archivo).
  - name: sessions
    description: Sesiones de clase (`class_session`).
  - name: time-slots
    description: Catálogo de franjas horarias reutilizables (`time_slot`).
  - name: conflicts
    description: Conflictos de horario detectados (`scheduling_conflict`).
  - name: reports
    description: Reportes propios del dominio scheduling.

paths:
  # ---------------------------------------------------------------- schedules
  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: Lista paginada de horarios.
      x-required-feature-any: [SCH_VIEW_ALL, SCH_VIEW_OWN]
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: ficha_id
          in: query
          required: false
          description: >-
            Referencia externa a `enrollment_ficha.id` en academic-management-service
            (sin FK física).
          schema: { type: string, format: uuid }
        - name: period
          in: query
          required: false
          description: 'Período académico, ej. `2026-1`.'
          schema: { type: string, maxLength: 10 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, UNDER_REVIEW, PUBLISHED, ARCHIVED]
        - name: from
          in: query
          required: false
          description: Inicio del rango de `created_at` (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Fin del rango de `created_at` (exclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de horarios.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Crea un horario en borrador (`DRAFT`) para una ficha y período.
      x-required-feature: SCH_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '201':
          description: Horario creado en `DRAFT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409':
          description: >-
            Ya existe un horario `PUBLISHED` para la misma `ficha_id` + `period` (el
            índice único parcial solo admite un publicado a la vez).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Obtiene un horario por id.
      x-required-feature-any: [SCH_VIEW_ALL, SCH_VIEW_OWN]
      responses:
        '200':
          description: Horario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Edita metadatos del borrador (`name`); requiere `row_version` vigente.
      x-required-feature: SCH_EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200':
          description: Horario actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `SCHEDULE_IMMUTABLE` (el horario está `PUBLISHED`) o `ROW_VERSION_MISMATCH`
            (edición concurrente).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Elimina (soft delete) un horario en `DRAFT`.
      x-required-feature: SCH_DELETE_DRAFT
      parameters:
        - name: row_version
          in: query
          required: true
          description: '`row_version` vigente del horario (bloqueo optimista).'
          schema: { type: integer, minimum: 0 }
      responses:
        '204':
          description: Horario eliminado.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `SCHEDULE_IMMUTABLE` (solo se puede eliminar en `DRAFT`) o
            `ROW_VERSION_MISMATCH`.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  /schedules/{id}/validate:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: validateSchedule
      tags: [schedules]
      summary: >-
        Ejecuta la validación síncrona final de conflictos y pasa el horario a
        `UNDER_REVIEW`.
      x-required-feature: SCH_EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowVersionRequest' }
      responses:
        '200':
          description: Horario en `UNDER_REVIEW` (puede incluir conflictos detectados).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_IMMUTABLE` o `ROW_VERSION_MISMATCH`.'
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '429': { $ref: '_shared.yaml#/components/responses/TooManyRequests' }

  /schedules/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: publishSchedule
      tags: [schedules]
      summary: >-
        Publica el horario (`UNDER_REVIEW → PUBLISHED`); emite
        `scheduling.schedule.published` vía Outbox.
      x-required-feature: SCH_PUBLISH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowVersionRequest' }
      responses:
        '200':
          description: Horario publicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `UNRESOLVED_CONFLICTS` (hay conflictos sin resolver), `SCHEDULE_IMMUTABLE`
            (no está en `UNDER_REVIEW`) o `ROW_VERSION_MISMATCH`.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  /schedules/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: archiveSchedule
      tags: [schedules]
      summary: Archiva el horario (`PUBLISHED → ARCHIVED`).
      x-required-feature: SCH_ARCHIVE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowVersionRequest' }
      responses:
        '200':
          description: Horario archivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_IMMUTABLE` (no está `PUBLISHED`) o `ROW_VERSION_MISMATCH`.'
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  /schedules/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: listScheduleSessions
      tags: [sessions]
      summary: Lista paginada de sesiones de un horario.
      x-required-feature-any: [SCH_VIEW_ALL, SCH_VIEW_OWN]
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, CANCELLED]
      responses:
        '200':
          description: Página de sesiones del horario.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: addScheduleSession
      tags: [sessions]
      summary: >-
        Agrega una sesión al borrador. `start_time`, `end_time` y `day_of_week` se
        copian de `time_slot` y son inmutables tras la creación.
      x-required-feature: SCH_EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201':
          description: Sesión creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `SCHEDULE_IMMUTABLE` (el horario no está en `DRAFT`) o doble-booking de
            instructor/ambiente detectado por el `EXCLUDE` constraint
            (`INSTRUCTOR_DOUBLE_BOOKED` / `ENVIRONMENT_DOUBLE_BOOKED`).
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /schedules/{id}/conflicts:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: listScheduleConflicts
      tags: [conflicts]
      summary: Lista paginada de conflictos detectados en el borrador.
      x-required-feature: SCH_CONFLICT_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: is_resolved
          in: query
          required: false
          schema: { type: boolean }
        - name: conflict_type
          in: query
          required: false
          schema:
            type: string
            enum: [INSTRUCTOR_DOUBLE_BOOKED, ENVIRONMENT_DOUBLE_BOOKED, SESSIONS_OVERLAP, ENVIRONMENT_MAINTENANCE, INSTRUCTOR_UNAVAILABLE, INSTRUCTOR_TRAVEL_CONFLICT]
      responses:
        '200':
          description: Página de conflictos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SchedulingConflict' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- sessions
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: Lista paginada de sesiones de clase (todas las que el scope permita).
      x-required-feature-any: [SCH_VIEW_ALL, SCH_VIEW_OWN]
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: schedule_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: instructor_id
          in: query
          required: false
          description: >-
            Referencia externa a `instructor.id` en actors-service (sin FK física).
          schema: { type: string, format: uuid }
        - name: environment_id
          in: query
          required: false
          description: >-
            Referencia externa a `environment.id` en training-environment-service (sin
            FK física).
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, CANCELLED]
        - name: from
          in: query
          required: false
          description: Inicio del rango de `session_date` (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Fin del rango de `session_date` (exclusive).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página de sesiones.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [sessions]
      summary: Obtiene una sesión de clase por id.
      x-required-feature-any: [SCH_VIEW_ALL, SCH_VIEW_OWN]
      responses:
        '200':
          description: Sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateSession
      tags: [sessions]
      summary: >-
        Edita una sesión del borrador (`notes` y reasignación de instructor / ambiente
        / franja).
      x-required-feature: SCH_EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdate' }
      responses:
        '200':
          description: Sesión actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `SCHEDULE_IMMUTABLE` (el horario padre no está en `DRAFT`) o
            doble-booking de instructor/ambiente.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Elimina (soft delete) una sesión del borrador.
      x-required-feature: SCH_EDIT
      responses:
        '204':
          description: Sesión eliminada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_IMMUTABLE` (el horario padre no está en `DRAFT`).'
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  /sessions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: cancelSession
      tags: [sessions]
      summary: >-
        Cancela la sesión (`ACTIVE → CANCELLED`); emite
        `scheduling.class_session.cancelled` vía Outbox.
      x-required-feature: SCH_EDIT
      responses:
        '200':
          description: Sesión cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: La sesión ya está `CANCELLED`.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  # ---------------------------------------------------------------- time-slots
  /time-slots:
    get:
      operationId: listTimeSlots
      tags: [time-slots]
      summary: Lista paginada de franjas horarias.
      x-required-feature: SCH_VIEW_ALL
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: day_of_week
          in: query
          required: false
          description: '1=lunes … 7=domingo.'
          schema: { type: integer, minimum: 1, maximum: 7 }
        - name: shift
          in: query
          required: false
          schema:
            type: string
            enum: [DAY, NIGHT, MIXED]
      responses:
        '200':
          description: Página de franjas horarias.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimeSlot' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createTimeSlot
      tags: [time-slots]
      summary: Crea una franja horaria reutilizable.
      x-required-feature: SCH_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeSlotCreate' }
      responses:
        '201':
          description: Franja creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSlot' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /time-slots/{id}:
    parameters:
      - $ref: '#/components/parameters/TimeSlotId'
    get:
      operationId: getTimeSlot
      tags: [time-slots]
      summary: Obtiene una franja horaria por id.
      x-required-feature: SCH_VIEW_ALL
      responses:
        '200':
          description: Franja horaria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSlot' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateTimeSlot
      tags: [time-slots]
      summary: Edita una franja horaria.
      x-required-feature: SCH_EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeSlotUpdate' }
      responses:
        '200':
          description: Franja actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSlot' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteTimeSlot
      tags: [time-slots]
      summary: Elimina (soft delete) una franja horaria no referenciada por sesiones activas.
      x-required-feature: SCH_EDIT
      responses:
        '204':
          description: Franja eliminada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: La franja está referenciada por sesiones de clase activas.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

  # ---------------------------------------------------------------- conflicts
  /conflicts/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ConflictId'
    post:
      operationId: resolveConflict
      tags: [conflicts]
      summary: Marca un conflicto como resuelto (`is_resolved = true`).
      x-required-feature: SCH_CONFLICT_RESOLVE
      responses:
        '200':
          description: Conflicto resuelto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingConflict' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409':
          description: El conflicto ya está resuelto.
          content:
            application/json:
              schema: { $ref: '_shared.yaml#/components/schemas/Error' }

