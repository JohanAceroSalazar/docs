        training_shift:
          type: string
          enum: [DAY, NIGHT, MIXED]
        training_modality:
          type: string
          enum: [IN_PERSON, VIRTUAL, HYBRID]
        max_capacity: { type: integer, minimum: 1 }

    FichaStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [INDUCTION, EXECUTION, PRODUCTIVE_STAGE, COMPLETED, CANCELLED]
          description: Estado destino; debe ser una transición válida desde el estado actual.
        actual_end_date:
          type: [string, 'null']
          format: date
