        program_name: { type: string }
        training_center_id: { type: string, format: uuid }
        status:
          type: string
          enum: [INDUCTION, EXECUTION, PRODUCTIVE_STAGE, COMPLETED, CANCELLED]
        max_capacity: { type: integer }
