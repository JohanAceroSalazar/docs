      summary: Seguimiento de aprendices por ficha, etapa y estado de inscripción.
      description: >-
        Reporte propio del dominio de actores. Cruza `learner`, `learner_ficha_enrollment`
        (inscripción vigente) y `productive_stage` (si el aprendiz está en etapa
        productiva). Solo lectura. Inventario — Usuarios: coordinación académica,
        instructores de seguimiento; Frecuencia: on-demand; Formato: JSON; Fuente:
        `actors_parameterization.learner`, `learner_ficha_enrollment`, `productive_stage`.
      x-required-feature: ACT_REPORT_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: ficha_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: enrollment_status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DROPOUT, TRANSFERRED, GRADUATED, CANCELLED]
        - name: from
          in: query
          required: false
          description: Inicio del rango de enrollment_date (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Fin del rango de enrollment_date (exclusive).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página del reporte de seguimiento.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LearnerTrackingReportEntry' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '429': { $ref: '_shared.yaml#/components/responses/TooManyRequests' }

