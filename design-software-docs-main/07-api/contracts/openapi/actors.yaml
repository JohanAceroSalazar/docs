    get:
      operationId: reportInstructorLoad
      tags: [reports]
      summary: Capacidad y disponibilidad de instructores.
      description: >-
        Reporte propio del dominio de actores. Cruza `instructor` (límite por defecto),
        `instructor_contract` (límite vigente), `instructor_area`, `competency_assignment`
        y `instructor_availability_exception` en el rango consultado. No incluye horas
        efectivamente asignadas (eso vive en scheduling-service). Solo lectura.
        Inventario — Usuarios: coordinación, scheduling-service (consumo batch);
        Frecuencia: on-demand; Formato: JSON; Fuente: `actors_parameterization.instructor`,
        `instructor_contract`, `instructor_area`, `competency_assignment`,
        `instructor_availability_exception`.
      x-required-feature: ACT_REPORT_VIEW
      parameters:
