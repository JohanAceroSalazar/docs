          schema: { type: string, format: uuid }
        - name: area
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Inicio del rango para excepciones de disponibilidad (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Fin del rango para excepciones de disponibilidad (exclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página del reporte de carga/disponibilidad.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstructorLoadReportEntry' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '429': { $ref: '_shared.yaml#/components/responses/TooManyRequests' }

  /catalogs:
    get:
      operationId: listActorCatalogs
      tags: [catalogs]
      summary: Lista catálogos internos usados por el dominio de actores.
      responses:
        '200':
          description: Catálogos disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /catalogs/{catalog_id}/details:
    get:
      operationId: listActorCatalogDetails
      tags: [catalogs]
      summary: Lista detalles de un catálogo interno del dominio de actores.
      parameters:
        - name: catalog_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalles del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /reports/active-catalog:
    get:
      operationId: reportActorActiveCatalog
      tags: [reports]
      summary: Reporte de catálogos activos usados por actores.
      responses:
        '200':
          description: Reporte generado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: UUID de la empresa.
      schema: { type: string, format: uuid }
    InstructorId:
      name: id
      in: path
      required: true
      description: UUID del instructor.
      schema: { type: string, format: uuid }
    LearnerId:
      name: id
      in: path
      required: true
      description: UUID del aprendiz.
      schema: { type: string, format: uuid }
    ProductiveStageId:
      name: id
      in: path
      required: true
      description: UUID de la etapa productiva.
      schema: { type: string, format: uuid }

  schemas:
    Company:
      type: object
      required: [id, nit, business_name, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        nit: { type: string, maxLength: 20 }
        business_name: { type: string, maxLength: 200 }
        trade_name:
          type: [string, 'null']
          maxLength: 200
        economic_activity:
          type: [string, 'null']
          maxLength: 100
          description: Actividad económica principal (CIIU).
        address:
          type: [string, 'null']
        city_id:
          type: [string, 'null']
          format: uuid
          description: Referencia lógica a Municipality en reference-data-service (sin FK física).
        contact_name:
          type: [string, 'null']
          maxLength: 200
          description: Nombre del responsable de etapa productiva.
        contact_email:
          type: [string, 'null']
          format: email
        contact_phone:
          type: [string, 'null']
          maxLength: 20
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyCreate:
      type: object
      required: [nit, business_name]
      properties:
        nit: { type: string, maxLength: 20 }
        business_name: { type: string, maxLength: 200 }
        trade_name: { type: string, maxLength: 200 }
        economic_activity: { type: string, maxLength: 100 }
        address: { type: string }
        city_id: { type: string, format: uuid }
        contact_name: { type: string, maxLength: 200 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, maxLength: 20 }

    CompanyUpdate:
      type: object
      properties:
        business_name: { type: string, maxLength: 200 }
        trade_name: { type: string, maxLength: 200 }
        economic_activity: { type: string, maxLength: 100 }
        address: { type: string }
        city_id: { type: string, format: uuid }
        contact_name: { type: string, maxLength: 200 }
        contact_email: { type: string, format: email }
        contact_phone: { type: string, maxLength: 20 }
        is_active: { type: boolean }

    Instructor:
      type: object
      required:
        [id, user_id, document_type, document_number, first_name, last_name, email,
         default_max_hours_per_week, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          description: Referencia lógica a user.id en iam-service (sin FK física).
        document_type:
          type: string
          enum: [CC, CE, PA, PE]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        full_name:
          type: string
          readOnly: true
          description: Derivado de first_name + last_name.
        email: { type: string, format: email }
        phone:
          type: [string, 'null']
          maxLength: 20
        default_max_hours_per_week:
          type: number
          minimum: 0
          description: Carga máxima autorizada por defecto; el contrato vigente puede sobrescribirla.
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InstructorCreate:
      type: object
      required: [user_id, document_type, document_number, first_name, last_name, email, default_max_hours_per_week]
      properties:
        user_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [CC, CE, PA, PE]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        default_max_hours_per_week: { type: number, minimum: 0 }

    InstructorUpdate:
      type: object
      properties:
        document_type:
          type: string
          enum: [CC, CE, PA, PE]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        default_max_hours_per_week: { type: number, minimum: 0 }
        is_active: { type: boolean }

    InstructorArea:
      type: object
      required: [id, instructor_id, area_name, is_primary, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        area_name: { type: string, maxLength: 100 }
        is_primary: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    InstructorAreaCreate:
      type: object
      required: [area_name]
      properties:
        area_name: { type: string, maxLength: 100 }
        is_primary: { type: boolean, default: false }

    InstructorContract:
      type: object
      required: [id, instructor_id, contract_type, start_date, training_center_id, is_current, created_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        contract_type:
          type: string
          enum: [STAFF, CONTRACTOR, HOURLY]
          description: STAFF=planta, CONTRACTOR=OPS, HOURLY=hora-cátedra.
        start_date: { type: string, format: date }
        end_date:
          type: [string, 'null']
          format: date
        training_center_id:
          type: string
          format: uuid
          description: Referencia lógica a training_center.id en reference-data-service (sin FK física).
        weekly_hour_limit:
          type: [number, 'null']
          description: Límite específico del contrato; fuente autoritativa del límite vigente.
        is_current: { type: boolean }
        notes:
          type: [string, 'null']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InstructorContractCreate:
      type: object
      required: [contract_type, start_date, training_center_id]
      properties:
        contract_type:
          type: string
          enum: [STAFF, CONTRACTOR, HOURLY]
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        training_center_id: { type: string, format: uuid }
        weekly_hour_limit: { type: number }
        notes: { type: string }

    InstructorContractUpdate:
      type: object
      properties:
        end_date: { type: string, format: date }
        weekly_hour_limit: { type: number }
        is_current: { type: boolean }
        notes: { type: string }

    CompetencyAssignment:
      type: object
      required: [id, instructor_id, competency_id, certified_at, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        competency_id:
          type: string
          format: uuid
          description: Referencia lógica a competency.id en academic-management-service (sin FK física).
        certified_at: { type: string, format: date }
        certification_entity:
          type: [string, 'null']
          maxLength: 200
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompetencyAssignmentCreate:
      type: object
      required: [competency_id, certified_at]
      properties:
        competency_id: { type: string, format: uuid }
        certified_at: { type: string, format: date }
        certification_entity: { type: string, maxLength: 200 }

    InstructorAvailabilityException:
      type: object
      required: [id, instructor_id, exception_type, start_datetime, end_datetime, created_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        exception_type:
          type: string
          enum: [SICK_LEAVE, VACATION, COMMISSION, PERSONAL_LEAVE, TRAINING, OTHER]
        start_datetime: { type: string, format: date-time }
        end_datetime: { type: string, format: date-time }
        description:
          type: [string, 'null']
        approved_by:
          type: [string, 'null']
          format: uuid
          description: Referencia lógica a user.id en iam-service (coordinador que aprobó).
        created_at: { type: string, format: date-time }

    InstructorAvailabilityExceptionCreate:
      type: object
      required: [exception_type, start_datetime, end_datetime]
      properties:
        exception_type:
          type: string
          enum: [SICK_LEAVE, VACATION, COMMISSION, PERSONAL_LEAVE, TRAINING, OTHER]
        start_datetime: { type: string, format: date-time }
        end_datetime: { type: string, format: date-time }
        description: { type: string }
        approved_by: { type: string, format: uuid }

    ActivityLogEntry:
      type: object
      required: [id, event_type, description, recorded_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id:
          type: [string, 'null']
          format: uuid
        learner_id:
          type: [string, 'null']
          format: uuid
        event_type:
          type: string
          maxLength: 60
          description: 'Ej: STATUS_CHANGED, COMPETENCY_ADDED, STAGE_CHANGED.'
        description: { type: string }
        previous_value:
          type: [string, 'null']
        new_value:
          type: [string, 'null']
        recorded_by:
          type: [string, 'null']
          format: uuid
          description: null = evento del sistema.
        recorded_at: { type: string, format: date-time }

    Learner:
      type: object
      required: [id, user_id, document_type, document_number, first_name, last_name, email, created_at]
      description: >-
        El estado de vinculación (enrollment_status_id) y la fecha de vinculación
        (enrollment_date) NO viven en esta entidad — pertenecen a la inscripción
        de ficha vigente; ver LearnerFichaEnrollment.
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          description: Referencia lógica a user.id en iam-service (sin FK física).
        document_type:
          type: string
          enum: [CC, CE, RC, TI]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        full_name:
          type: string
          readOnly: true
          description: Derivado de first_name + last_name.
        email: { type: string, format: email }
        phone:
          type: [string, 'null']
          maxLength: 20
        birth_date:
          type: [string, 'null']
          format: date
        created_at: { type: string, format: date-time }

    LearnerCreate:
      type: object
      required: [user_id, document_type, document_number, first_name, last_name, email]
      properties:
        user_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [CC, CE, RC, TI]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        birth_date: { type: string, format: date }

    LearnerUpdate:
      type: object
      properties:
        document_type:
          type: string
          enum: [CC, CE, RC, TI]
        document_number: { type: string, maxLength: 20 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        birth_date: { type: string, format: date }

    LearnerFichaEnrollment:
      type: object
      required: [id, learner_id, ficha_id, enrollment_status_id, stage, enrollment_date, is_current, created_at]
      properties:
        id: { type: string, format: uuid }
        learner_id: { type: string, format: uuid }
        ficha_id:
          type: string
          format: uuid
          description: Referencia lógica a enrollment_ficha.id en academic-management-service (sin FK física).
        enrollment_status_id:
          type: string
          format: uuid
          description: >-
            FK a actors_parameterization.status (status_category del dominio de
            inscripción de aprendices). Reemplaza el enum plano legado.
        stage:
          type: string
          enum: [INDUCTION, LECTURE, PRODUCTIVE]
        enrollment_date: { type: string, format: date }
        completion_date:
          type: [string, 'null']
          format: date
          description: null = inscripción vigente.
        is_current:
          type: boolean
          description: true = inscripción activa; solo una por aprendiz.
        transfer_reason:
          type: [string, 'null']
        created_at: { type: string, format: date-time }

    LearnerFichaEnrollmentCreate:
      type: object
      required: [ficha_id, stage, enrollment_date]
      properties:
        ficha_id: { type: string, format: uuid }
        stage:
          type: string
          enum: [INDUCTION, LECTURE, PRODUCTIVE]
        enrollment_date: { type: string, format: date }
        transfer_reason: { type: string }

    ProductiveStage:
      type: object
      required:
        [id, learner_id, company_id, supervisor_instructor_id, start_date, planned_end_date,
         total_hours_required, total_hours_completed, status_id, created_at]
      properties:
        id: { type: string, format: uuid }
        learner_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        supervisor_instructor_id:
          type: string
          format: uuid
          description: Instructor de seguimiento.
        start_date: { type: string, format: date }
        planned_end_date: { type: string, format: date }
        actual_end_date:
          type: [string, 'null']
          format: date
        total_hours_required: { type: integer, minimum: 0 }
        total_hours_completed: { type: integer, minimum: 0 }
        status_id:
          type: string
          format: uuid
          description: FK a actors_parameterization.status. Reemplaza el enum plano legado.
        interruption_reason:
          type: [string, 'null']
          description: Solo si el status vigente corresponde a INTERRUPTED.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductiveStageCreate:
      type: object
      required: [learner_id, company_id, supervisor_instructor_id, start_date, planned_end_date, total_hours_required]
      properties:
        learner_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        supervisor_instructor_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
        planned_end_date: { type: string, format: date }
        total_hours_required: { type: integer, minimum: 0 }

    ProductiveStageUpdate:
      type: object
      properties:
        planned_end_date: { type: string, format: date }
        actual_end_date: { type: string, format: date }
        total_hours_completed: { type: integer, minimum: 0 }
        status_id: { type: string, format: uuid }
        interruption_reason: { type: string }

    CompanyVisit:
      type: object
      required: [id, productive_stage_id, instructor_id, visit_number, visit_date, visit_type, learner_performance, has_improvement_plan, created_at]
      properties:
        id: { type: string, format: uuid }
        productive_stage_id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        visit_number:
          type: integer
          description: Número de visita (1, 2, 3...).
        visit_date: { type: string, format: date }
        visit_type:
          type: string
          enum: [IN_PERSON, VIRTUAL, PHONE]
        learner_performance:
          type: string
          enum: [EXCELLENT, GOOD, ACCEPTABLE, DEFICIENT]
        company_satisfaction:
          type: [string, 'null']
          enum: [HIGH, MEDIUM, LOW]
        observations:
          type: [string, 'null']
        next_visit_date:
          type: [string, 'null']
          format: date
        has_improvement_plan: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyVisitCreate:
      type: object
      required: [instructor_id, visit_number, visit_date, visit_type, learner_performance]
      properties:
        instructor_id: { type: string, format: uuid }
        visit_number: { type: integer }
        visit_date: { type: string, format: date }
        visit_type:
          type: string
          enum: [IN_PERSON, VIRTUAL, PHONE]
        learner_performance:
          type: string
          enum: [EXCELLENT, GOOD, ACCEPTABLE, DEFICIENT]
        company_satisfaction:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        observations: { type: string }
        next_visit_date: { type: string, format: date }
        has_improvement_plan: { type: boolean, default: false }

    CompanyVisitUpdate:
      type: object
      properties:
        learner_performance:
          type: string
          enum: [EXCELLENT, GOOD, ACCEPTABLE, DEFICIENT]
        company_satisfaction:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        observations: { type: string }
        next_visit_date: { type: string, format: date }
        has_improvement_plan: { type: boolean }

    ActorImprovementPlan:
      type: object
      required: [id, origin, description, specific_goals, due_date, status_id, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id:
          type: [string, 'null']
          format: uuid
          description: Arco exclusivo con learner_id — exactamente uno debe estar poblado.
        learner_id:
          type: [string, 'null']
          format: uuid
          description: Arco exclusivo con instructor_id — exactamente uno debe estar poblado.
        origin:
          type: string
          enum: [COMPANY_VISIT, PERFORMANCE_REVIEW, TRACKING_SESSION, DISCIPLINARY]
        origin_reference_id:
          type: [string, 'null']
          format: uuid
          description: ID del company_visit o sesión de origen, si aplica.
        description: { type: string }
        specific_goals:
          type: string
          description: Metas específicas y verificables.
        due_date: { type: string, format: date }
        status_id:
          type: string
          format: uuid
          description: FK a actors_parameterization.status. Reemplaza el enum plano legado.
        created_by:
          type: string
          format: uuid
          description: Referencia lógica a user.id en iam-service (sin FK física).
        created_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time

    ActorImprovementPlanCreate:
      type: object
      required: [origin, description, specific_goals, due_date]
      description: >-
        Debe incluir exactamente uno de instructor_id / learner_id; la violación
        del arco exclusivo responde 422.
      properties:
        instructor_id: { type: string, format: uuid }
        learner_id: { type: string, format: uuid }
        origin:
          type: string
          enum: [COMPANY_VISIT, PERFORMANCE_REVIEW, TRACKING_SESSION, DISCIPLINARY]
        origin_reference_id: { type: string, format: uuid }
        description: { type: string }
        specific_goals: { type: string }
        due_date: { type: string, format: date }

    ActorImprovementPlanUpdate:
      type: object
      properties:
        description: { type: string }
        specific_goals: { type: string }
        due_date: { type: string, format: date }
        status_id: { type: string, format: uuid }
        completed_at: { type: string, format: date-time }

    LearnerTrackingReportEntry:
      type: object
      required: [learner_id, document_number, full_name, enrollment_status, ficha_id, stage, ficha_enrollment_date]
      properties:
        learner_id: { type: string, format: uuid }
        document_number: { type: string }
        full_name: { type: string }
        enrollment_status:
          type: string
          enum: [ACTIVE, DROPOUT, TRANSFERRED, GRADUATED, CANCELLED]
        ficha_id:
          type: string
          format: uuid
          description: Referencia lógica a academic-management-service.
        stage:
          type: string
          enum: [INDUCTION, LECTURE, PRODUCTIVE]
        ficha_enrollment_date: { type: string, format: date }
        productive_stage_status:
          type: [string, 'null']
          enum: [ACTIVE, COMPLETED, INTERRUPTED, CANCELLED, null]
        productive_stage_company_id:
          type: [string, 'null']
          format: uuid

    InstructorLoadReportEntry:
      type: object
      required: [instructor_id, document_number, full_name, default_max_hours_per_week, active_areas_count, active_competencies_count, active_exceptions_count]
      properties:
        instructor_id: { type: string, format: uuid }
        document_number: { type: string }
        full_name: { type: string }
        default_max_hours_per_week: { type: number }
        current_contract_weekly_hour_limit:
          type: [number, 'null']
        training_center_id:
          type: [string, 'null']
          format: uuid
          description: Centro del contrato vigente (reference-data-service).
        active_areas_count: { type: integer, minimum: 0 }
        active_competencies_count: { type: integer, minimum: 0 }
        active_exceptions_count:
          type: integer
          minimum: 0
          description: Excepciones de disponibilidad que solapan el rango from/to consultado.


    ActiveLearnersCount:
      type: object
      required: [ficha_id, active_learners]
      properties:
        ficha_id:
          type: string
          format: uuid
          description: Identificador de la ficha consultada.
        active_learners:
          type: integer
          format: int64
          minimum: 0
          description: Numero de aprendices activos con inscripcion vigente en la ficha.

    ActiveFichaByLearnerUser:
      type: object
      required: [learner_id, ficha_id]
      properties:
        learner_id:
          type: string
          format: uuid
          description: Identificador del perfil de aprendiz en actors-service.
