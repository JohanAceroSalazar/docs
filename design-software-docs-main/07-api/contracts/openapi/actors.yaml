openapi: 3.1.0
info:
  title: Actors Service API — Horarios SENA
  version: 1.0.0
  description: >-
    Gestión de instructores, aprendices y empresas: contratos, áreas de conocimiento,
    competencias asignadas, disponibilidad, historial de fichas, etapa productiva,
    visitas de seguimiento y planes de mejoramiento individual. Alineado con el modelo
    de datos de actors-service (schema `actors_parameterization`) y con
    07-api/guidelines.md. Fuente de verdad del contrato. La extensión
    `x-required-feature` declara el feature RBAC que exige cada operación.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: companies
    description: Empresas que participan en la etapa productiva.
  - name: instructors
    description: Instructores, contratos, áreas, competencias y disponibilidad.
  - name: learners
    description: Aprendices y su historial de fichas.
  - name: tracking
    description: Etapa productiva, visitas de seguimiento y planes de mejoramiento.
  - name: reports
    description: Reportes propios del dominio de actores.

paths:
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: Lista paginada de empresas.
      x-required-feature: ACT_COMPANY_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: nit
          in: query
          required: false
          description: Filtra por número de identificación tributaria.
          schema: { type: string }
        - name: city_id
          in: query
          required: false
          description: Filtra por municipio (reference-data-service).
          schema: { type: string, format: uuid }
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Página de empresas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createCompany
      tags: [companies]
      summary: Registra una empresa.
      x-required-feature: ACT_COMPANY_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyCreate' }
      responses:
        '201':
          description: Empresa creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      operationId: getCompany
      tags: [companies]
      summary: Detalle de una empresa.
      x-required-feature: ACT_COMPANY_VIEW
      responses:
        '200':
          description: Empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateCompany
      tags: [companies]
      summary: Reemplaza los datos de la empresa.
      x-required-feature: ACT_COMPANY_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdate' }
      responses:
        '200':
          description: Empresa actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    patch:
      operationId: patchCompany
      tags: [companies]
      summary: Actualiza parcialmente la empresa.
      x-required-feature: ACT_COMPANY_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdate' }
      responses:
        '200':
          description: Empresa actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Desactiva la empresa (soft delete, is_active = false).
      x-required-feature: ACT_COMPANY_MANAGE
      responses:
        '204':
          description: Empresa desactivada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: Lista paginada de instructores.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: document_number
          in: query
          required: false
          schema: { type: string }
        - name: area
          in: query
          required: false
          description: Filtra por nombre de área tecnológica (instructor_area.area_name).
          schema: { type: string }
        - name: training_center_id
          in: query
          required: false
          description: Filtra por centro de formación del contrato vigente (reference-data-service).
          schema: { type: string, format: uuid }
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Página de instructores.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Instructor' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createInstructor
      tags: [instructors]
      summary: Crea un instructor.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorCreate' }
      responses:
        '201':
          description: Instructor creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instructor' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /instructors/{id}:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: getInstructor
      tags: [instructors]
      summary: Detalle de un instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      responses:
        '200':
          description: Instructor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instructor' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateInstructor
      tags: [instructors]
      summary: Reemplaza los datos del instructor.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorUpdate' }
      responses:
        '200':
          description: Instructor actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instructor' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    patch:
      operationId: patchInstructor
      tags: [instructors]
      summary: Actualiza parcialmente el instructor.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorUpdate' }
      responses:
        '200':
          description: Instructor actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instructor' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteInstructor
      tags: [instructors]
      summary: Desactiva el instructor (soft delete, is_active = false).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      responses:
        '204':
          description: Instructor desactivado.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /instructors/{id}/areas:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: listInstructorAreas
      tags: [instructors]
      summary: Áreas tecnológicas del instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      responses:
        '200':
          description: Lista de áreas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstructorArea' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: addInstructorArea
      tags: [instructors]
      summary: Asigna un área tecnológica al instructor.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorAreaCreate' }
      responses:
        '201':
          description: Área asignada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorArea' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }

  /instructors/{id}/areas/{area_id}:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
      - name: area_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeInstructorArea
      tags: [instructors]
      summary: Retira un área tecnológica del instructor (soft delete, is_active = false).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      responses:
        '204':
          description: Área retirada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /instructors/{id}/contracts:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: listInstructorContracts
      tags: [instructors]
      summary: Historial de contratos del instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      responses:
        '200':
          description: Lista de contratos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstructorContract' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: createInstructorContract
      tags: [instructors]
      summary: Registra un nuevo contrato (marca is_current y cierra el contrato vigente anterior).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorContractCreate' }
      responses:
        '201':
          description: Contrato creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorContract' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /instructors/{id}/contracts/{contract_id}:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
      - name: contract_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getInstructorContract
      tags: [instructors]
      summary: Detalle de un contrato del instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      responses:
        '200':
          description: Contrato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorContract' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateInstructorContract
      tags: [instructors]
      summary: Actualiza un contrato (p. ej. cerrarlo con end_date e is_current = false).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorContractUpdate' }
      responses:
        '200':
          description: Contrato actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorContract' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /instructors/{id}/competencies:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: listInstructorCompetencies
      tags: [instructors]
      summary: Competencias asignadas al instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      responses:
        '200':
          description: Lista de competencias asignadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompetencyAssignment' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: addInstructorCompetency
      tags: [instructors]
      summary: Asigna una competencia (referencia a academic-management-service) al instructor.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetencyAssignmentCreate' }
      responses:
        '201':
          description: Competencia asignada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetencyAssignment' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }

  /instructors/{id}/competencies/{competency_assignment_id}:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
      - name: competency_assignment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeInstructorCompetency
      tags: [instructors]
      summary: Revoca una competencia asignada (soft delete, is_active = false).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      responses:
        '204':
          description: Competencia revocada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /instructors/{id}/availability-exceptions:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: listInstructorAvailabilityExceptions
      tags: [instructors]
      summary: Bloqueos de disponibilidad no recurrentes del instructor.
      x-required-feature: ACT_INSTRUCTOR_VIEW
      parameters:
        - name: from
          in: query
          required: false
          description: Inicio del rango (inclusive), compara contra end_datetime.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Fin del rango (exclusive), compara contra start_datetime.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Lista de excepciones de disponibilidad.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstructorAvailabilityException' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: createInstructorAvailabilityException
      tags: [instructors]
      summary: Registra un bloqueo de disponibilidad (permiso, licencia, incapacidad, etc.).
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructorAvailabilityExceptionCreate' }
      responses:
        '201':
          description: Excepción registrada; dispara actors.instructor.availability_changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorAvailabilityException' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /instructors/{id}/availability-exceptions/{exception_id}:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
      - name: exception_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeInstructorAvailabilityException
      tags: [instructors]
      summary: Elimina un bloqueo de disponibilidad registrado por error.
      x-required-feature: ACT_INSTRUCTOR_MANAGE
      responses:
        '204':
          description: Excepción eliminada; dispara actors.instructor.availability_changed.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /instructors/{id}/activity-log:
    parameters:
      - $ref: '#/components/parameters/InstructorId'
    get:
      operationId: listInstructorActivityLog
      tags: [instructors]
      summary: Bitácora funcional del instructor (solo lectura, append-only).
      x-required-feature: ACT_INSTRUCTOR_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/cursor'
        - $ref: '_shared.yaml#/components/parameters/limit'
      responses:
        '200':
          description: Página de eventos de bitácora.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityLogEntry' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/CursorPagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- learners
  /learners:
    get:
      operationId: listLearners
      tags: [learners]
      summary: Lista paginada de aprendices.
      x-required-feature: ACT_LEARNER_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: document_number
          in: query
          required: false
          schema: { type: string }
        - name: ficha_id
          in: query
          required: false
          description: Filtra por ficha activa (learner_ficha_enrollment.is_current = true).
          schema: { type: string, format: uuid }
        - name: enrollment_status_id
          in: query
          required: false
          description: >-
            Filtra por el estado de la inscripción vigente
            (learner_ficha_enrollment.enrollment_status_id, is_current = true).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de aprendices.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Learner' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createLearner
      tags: [learners]
      summary: Crea un aprendiz.
      x-required-feature: ACT_LEARNER_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearnerCreate' }
      responses:
        '201':
