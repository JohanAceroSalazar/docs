  # ---------------------------------------------------------------- internal (service-to-service)
  /internal/fichas/{ficha_id}/active-learners/count:
    servers:
      - url: /
    get:
      operationId: countActiveLearnersByFicha
      tags: [learners]
      summary: Cuenta aprendices activos por ficha.
      description: >-
        Endpoint interno servicio-a-servicio consumido por academic-management-service
        para validar reducciones de cupo sin acceder directamente a la base de datos
        de actors-service. La operación es de solo lectura.
      x-required-feature: ACT_INTERNAL_FICHA_LEARNER_COUNT
      parameters:
        - name: ficha_id
          in: path
          required: true
          description: Identificador de la ficha en academic-management-service.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conteo de aprendices activos de la ficha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveLearnersCount'
              examples:
                without_active_learners:
                  value:
                    ficha_id: 00000000-0000-4000-8000-000000000001
                    active_learners: 0
                with_active_learners:
                  value:
                    ficha_id: 00000000-0000-4000-8000-000000000002
                    active_learners: 25
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '502':
          description: Academic Management no disponible para validar la existencia de la ficha.
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/Error'

  /internal/learners/by-user/{user_id}/active-ficha:
    servers:
      - url: /
    get:
      operationId: getActiveFichaByLearnerUser
      tags: [learners]
      summary: Consulta la ficha activa de un aprendiz por user_id de IAM.
      description: >-
        Endpoint interno servicio-a-servicio consumido exclusivamente por
        iam-service para resolver la ficha activa de un aprendiz sin acceder
        directamente a la base de datos de actors-service. El flujo posterior
        hacia scheduling-service usa el JWT emitido por IAM y su claim
        ficha_id; scheduling-service no consume este endpoint directamente.
        La operación es de solo lectura y debe protegerse exclusivamente con
        mTLS entre servicios; no usa Bearer JWT ni features RBAC.
      security:
        - mutualTLS: []
      x-internal: true
      x-authentication: mtls
      parameters:
        - name: user_id
          in: path
          required: true
          description: Identificador del usuario en iam-service.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aprendiz activo con exactamente una ficha activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveFichaByLearnerUser'
              examples:
                active_ficha:
                  value:
                    learner_id: 00000000-0000-4000-8000-000000000101
                    ficha_id: 00000000-0000-4000-8000-000000000201
        '204':
          description: Aprendiz activo sin ficha activa.
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '500':
          description: Error tecnico controlado; no debe interpretarse como ausencia de ficha.
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/Error'

